<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Tour Virtual Concepto - Navegación Táctil</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      
      <a-assets>
        <img id="img_Entrada" src="https://conceptove.github.io/Concepto-Furnitures/Entrada.png">
        <img id="img_Cocina_1" src="https://conceptove.github.io/Concepto-Furnitures/Cocina_1.png">
        <img id="img_Cocina_2" src="https://conceptove.github.io/Concepto-Furnitures/Cocina_2.png">
        <img id="img_Sala_1" src="https://conceptove.github.io/Concepto-Furnitures/Sala_1.png">
        <img id="img_Sala_2" src="https://conceptove.github.io/Concepto-Furnitures/Sala_2.png">
      </a-assets>

      <a-sky id="escena-360" src="#img_Entrada" rotation="0 -90 0"></a-sky>

      <a-camera>
        <a-cursor raycaster="objects: .clickable" cursor="rayOrigin: mouse" color="#FF0000" opacity="0.5"></a-cursor>
      </a-camera>

      <a-sphere class="btn-Entrada clickable" position="3 1 -4" radius="0.3" color="yellow" 
                onclick="irA('img_Cocina_1')">
        <a-text value="Ir a Cocina" align="center" position="0 0.8 0" scale="1.5 1.5 1.5"></a-text>
      </a-sphere>

      <a-sphere class="btn-Cocina_1 clickable" position="-4 1 2" radius="0.3" color="green" visible="false" scale="0 0 0"
                onclick="irA('img_Cocina_2')">
        <a-text value="Ir a Cocina 2" align="center" position="0 0.8 0" scale="1.5 1.5 1.5"></a-text>
      </a-sphere>
      <a-sphere class="btn-Cocina_1 clickable" position="0 1 4" radius="0.3" color="white" visible="false" scale="0 0 0"
                onclick="irA('img_Entrada')">
        <a-text value="Volver Entrada" align="center" position="0 0.8 0" scale="1.5 1.5 1.5"></a-text>
      </a-sphere>

      <a-sphere class="btn-Cocina_2 clickable" position="-3 1 4" radius="0.3" color="cyan" visible="false" scale="0 0 0"
                onclick="irA('img_Sala_1')">
        <a-text value="Ir a Sala 1" align="center" position="0 0.8 0" scale="1.5 1.5 1.5"></a-text>
      </a-sphere>

      <a-sphere class="btn-Sala_1 clickable" position="4 1 -2" radius="0.3" color="orange" visible="false" scale="0 0 0"
                onclick="irA('img_Sala_2')">
        <a-text value="Ir a Sala 2" align="center" position="0 0.8 0" scale="1.5 1.5 1.5"></a-text>
      </a-sphere>

      <a-sphere class="btn-Sala_2 clickable" position="0 1 5" radius="0.3" color="red" visible="false" scale="0 0 0"
                onclick="irA('img_Cocina_2')">
        <a-text value="Regresar a Cocina 2" align="center" position="0 0.8 0" scale="1.5 1.5 1.5"></a-text>
      </a-sphere>

    </a-scene>

    <script>
      function irA(idDestino) {
        const sky = document.querySelector('#escena-360');
        sky.setAttribute('src', '#' + idDestino);

        // Ocultar todos los botones
        const todosLosBotones = document.querySelectorAll('.clickable');
        todosLosBotones.forEach(btn => {
          btn.setAttribute('visible', 'false');
          btn.setAttribute('scale', '0 0 0');
        });

        // Activar botones del nuevo ambiente
        const claseAActivar = ".btn-" + idDestino.replace('img_', ''); 
        const botonesNuevos = document.querySelectorAll(claseAActivar);
        
        botonesNuevos.forEach(btn => {
          btn.setAttribute('visible', 'true');
          btn.setAttribute('scale', '1 1 1');
        });
      }
    </script>
  </body>
</html>
